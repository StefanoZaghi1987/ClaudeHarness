name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  self-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash skills/skills-resync/scripts/resync.sh --self-test
      - if: runner.os == 'macOS'
        run: /bin/bash skills/skills-resync/scripts/resync.sh --self-test
  build:
    needs: self-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The tag name reaches the shell through env, never pasted into the script text.
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 build_release.py "$TAG"
      # A version-free copy, so the README can link releases/latest/download/claude-harness.zip.
      - run: cp "dist/claude-harness-$TAG.zip" dist/claude-harness.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
